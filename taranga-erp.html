/* Layout: dark navy rail + gradient page banners; telco-style blue, cyan, violet and magenta palette taken from the Taranga logo */
:root{
  --bg:#EEF3FF; --surface:#FFFFFF; --surface2:#E7EEFD; --line:#D2DCF2; --fg:#0B1530; --muted:#52648C;
  --accent:#1F5FFF; --accent-ink:#FFFFFF; --accent-soft:#DDE8FF;
  --good:#0B8A5F; --good-soft:#D6F5E8; --warn:#9A5B00; --warn-soft:#FFE9BF; --bad:#C4204B; --bad-soft:#FFDCE4;

  --t1:#1F5FFF; --t2:#0A86A8; --t3:#7B3FF2; --t4:#D1237F;
  --grad:linear-gradient(120deg,#1F5FFF 0%,#2D8CFF 38%,#00B8D9 70%,#7B3FF2 125%);

  --k-cash:#6B7C85; --k-bkash:#D6246E; --k-rocket:#8B2F9B; --k-nagad:#E8702A; --k-bank:#2B5FB8;

  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#050816; --surface:#0C1330; --surface2:#121B42; --line:#222E62; --fg:#E8EEFF; --muted:#90A2D2;
    --accent:#6C9BFF; --accent-ink:#06102A; --accent-soft:#16245C;
    --good:#46E0A8; --good-soft:#0E3A2E; --warn:#FFC24D; --warn-soft:#3F2E08; --bad:#FF7C9C; --bad-soft:#47142A;
    --c1:#5C8DFF; --c2:#A98BFF; --c3:#FFB83D; --c4:#FF6FB5; --c5:#2FE0B0;
    --t1:#6C9BFF; --t2:#3FD0F0; --t3:#B197FF; --t4:#FF7FBF;
    --grad:linear-gradient(120deg,#1B4FE0 0%,#2478E8 40%,#0CA5C4 74%,#6A35E0 125%);
    --k-cash:#9FB1B9; --k-bkash:#F0629B; --k-rocket:#C47BD3; --k-nagad:#F59A5C; --k-bank:#6F9CF0;

}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,p{margin:0}
button{font:inherit}
.app{max-width:1380px;margin:0 auto;display:grid;grid-template-columns:216px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}

a.btn{text-decoration:none;display:inline-block}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;display:flex;flex-direction:column;gap:8px;justify-content:space-between}
.rcard b{display:block}
.rcard small{color:var(--muted)}
.who{padding:0 8px}
.note.info{background:var(--accent-soft);color:var(--accent)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.uhero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.brand b{font-size:16px;font-weight:600;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--surface2);color:var(--fg)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{min-width:0;display:flex;flex-direction:column;gap:22px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h1{font-size:23px;font-weight:600;letter-spacing:-.2px;text-wrap:balance}
.sub{color:var(--muted);margin-top:2px;max-width:62ch}
.hact{display:flex;gap:8px;flex-wrap:wrap}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{font-weight:500;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input:focus,select:focus{border-color:var(--accent)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;min-width:0}
.kl{font-size:12px;color:var(--muted);font-weight:500}
.kv{font:500 21px/1.3 var(--mono);font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.ks{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.big{background:var(--accent-soft);border-color:transparent}
.kpi.big .kv{color:var(--accent)}
.kpi.neg .kv{color:var(--bad)}
.kpi.pos .kv{color:var(--good)}
.chans{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:10px}
.chan{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;border-top:3px solid var(--c)}
.chan .kv{font-size:19px}
.chan .ks{display:flex;justify-content:space-between;gap:8px}
.k-cash{--c:var(--k-cash)}.k-bkash{--c:var(--k-bkash)}.k-rocket{--c:var(--k-rocket)}.k-nagad{--c:var(--k-nagad)}.k-bank{--c:var(--k-bank)}
.ch{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.ch i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.fl select,.fl input{width:auto;min-width:130px;max-width:100%}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tab.on{color:var(--accent);border-color:var(--accent)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse}
th{background:var(--surface2);color:var(--muted);font-size:12px;font-weight:500;text-align:left;padding:8px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:color-mix(in srgb,var(--surface2) 55%,transparent)}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:600;background:var(--surface2)}
td.act{text-align:right;white-space:nowrap}
td small{display:block;color:var(--muted);font-size:12px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface2);color:var(--muted)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.in{color:var(--good)}.out{color:var(--bad)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;color:var(--muted)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.hero h2{font-size:18px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.two{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.panel h3{font-size:13.5px;font-weight:600;margin-bottom:10px}
.chart{padding-left:44px}
.plot{position:relative;height:190px}
.gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.gl span{position:absolute;left:-44px;top:-8px;width:38px;text-align:right;font:11px var(--mono);color:var(--muted)}
.bars{position:absolute;inset:0;display:flex}
.pair{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%}
.bar{width:min(16px,28%);border-radius:3px 3px 0 0;min-height:1px}
.xl{display:flex;margin-top:6px}
.xl span{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface2);margin-bottom:12px}
.stack span{display:block;height:100%}
.list{display:flex;flex-direction:column}
.list .li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
.list .li:first-child{border-top:0}
.li small{color:var(--muted);display:block;font-size:12px}

<script>
(function(){
'use strict';
var CH=['Cash','bKash','Rocket','Nagad','Bank Transfer'];
var CHC={'Cash':'cash','bKash':'bkash','Rocket':'rocket','Nagad':'nagad','Bank Transfer':'bank'};
var CATS=['Salary','Utility','Labour Bill','Electricity Bill','Others'];
var COLS=['investors','clients','bills','vendors','purchases','costs','stock','moves','payments','team'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var PAGES=[['dashboard','Dashboard'],['investors','Investors'],['clients','Clients'],['billing','Billing'],['purchases','Purchases'],['vendors','Vendors'],['costs','Costs'],['stock','Stock'],['ledger','Ledger'],['reports','Reports'],['users','Users']];
var ICON={
  dashboard:'M3 3h7v7H3zM14 3h7v4h-7zM14 11h7v10h-7zM3 14h7v7H3z',
  investors:'M12 2v20M17 6.5H9.5a3 3 0 000 6h5a3 3 0 010 6H6.5',
  clients:'M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM22 21v-2a4 4 0 00-3-3.9M16 3.1a4 4 0 010 7.8',
  billing:'M6 2h12v20l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6M9 15h4',
  purchases:'M3 4h2l2.4 11h10.2L20 7H6M9 20.5a.5.5 0 100-1 .5.5 0 000 1zM17 20.5a.5.5 0 100-1 .5.5 0 000 1z',
  vendors:'M4 21V5l8-3 8 3v16M9 21v-4h6v4M8 9h2M14 9h2M8 13h2M14 13h2',
  costs:'M12 22a10 10 0 100-20 10 10 0 000 20zM8 12h8M12 8v8',
  stock:'M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',
  ledger:'M4 4h16v16H4zM4 9h16M9 9v11',
  reports:'M6 2h9l5 5v15H6zM14 2v6h6M9 13h8M9 17h8M9 9h2',
  users:'M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5zM9 12l2 2 4-4'
};
var S={}; COLS.forEach(function(c){S[c]=[]});
var D={paid:{},paidP:{},sin:{},sout:{}};
var UI={rp:thisMonth(),page:'dashboard',btab:'bills',month:thisMonth(),bm:thisMonth(),bc:'',bs:'',cm:thisMonth(),cch:'',pm:'',pv:'',km:thisMonth(),kc:'',cq:'',lm:thisMonth(),lch:'',ld:''};
var CAN=false,READ={btab:1,catf:1,csv:1,backup:1,closeModal:1,'rp-csv':1,'rp-xlsx':1};
var db=null,mode='loading',ready=false,loaded={},q=Promise.resolve(),raf=0,M={submit:null,kind:''};
var LS='taranga-erp-v1';

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0}
function sum(a,f){var s=0;for(var i=0;i<a.length;i++)s+=num(f(a[i]));return s}
function p2(n){return (n<10?'0':'')+n}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function thisMonth(){return today().slice(0,7)}
function monthOf(d){return (d||'').slice(0,7)}
function fmtN(n){return (n<0?'−':'')+Math.abs(n).toLocaleString('en-IN',{maximumFractionDigits:2})}
function fmt(n){return (n<0?'−':'')+'৳'+Math.abs(n).toLocaleString('en-IN',{maximumFractionDigits:2})}
function short(n){var a=Math.abs(n);if(a>=1e7)return +(n/1e7).toFixed(1)+'Cr';if(a>=1e5)return +(n/1e5).toFixed(1)+'L';if(a>=1e3)return +(n/1e3).toFixed(1)+'k';return String(Math.round(n))}
function fd(s){return s&&s.length>=10?(+s.slice(8,10))+' '+MON[+s.slice(5,7)-1]+' '+s.slice(0,4):'—'}
function ml(m){return m&&m.length>=7?MON[+m.slice(5,7)-1]+' '+m.slice(0,4):'All months'}
function md(off,day){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);var dd=off===0?Math.min(day,new Date().getDate()):day;return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(dd)}
function find(col,id){for(var i=0;i<S[col].length;i++)if(S[col][i].id===id)return S[col][i];return null}
function clientName(id){var c=find('clients',id);return c?c.name:'Unknown client'}
function vendorName(id){var v=find('vendors',id);return v?v.name:'Unknown vendor'}
function itemName(id){var i=find('stock',id);return i?i.name:'Unknown item'}
function chip(ch){return '<span class="ch k-'+(CHC[ch]||'cash')+'"><i></i>'+esc(ch||'—')+'</span>'}
function pill(t,c){return '<span class="pill '+c+'">'+esc(t)+'</span>'}
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},3200)}

/* ---------- storage: shared db when granted, otherwise this browser ---------- */
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function lsLoad(){try{var o=JSON.parse(localStorage.getItem(LS)||'{}');COLS.forEach(function(c){S[c]=Array.isArray(o[c])?o[c]:[]})}catch(e){}}
function dbErr(e){var c=e&&e.code;toast(c==='quota_exceeded'?'Storage limit reached. Remove old records.':c==='invalid_argument'?'You do not have permission to change this data.':'Could not save. Check your connection and try again.')}
function put(col,rec){
  if(!CAN){toast('View only: Guest users cannot change data.');return rec}
  if(!rec.id)rec.id=uid();
  var i=-1;for(var k=0;k<S[col].length;k++)if(S[col][k].id===rec.id){i=k;break}
  if(i>=0)S[col][i]=rec;else S[col].push(rec);
  if(db){var body=JSON.parse(JSON.stringify(rec));delete body.id;var id=rec.id;q=q.then(function(){return db.collection(col).doc(id).set(body)}).catch(dbErr)}else lsSave();
  schedule();return rec;
}
function del(col,id){
  if(!CAN){toast('View only: Guest users cannot change data.');return}
  S[col]=S[col].filter(function(x){return x.id!==id});
  if(db){q=q.then(function(){return db.collection(col).doc(id).delete()}).catch(dbErr)}else lsSave();
  schedule();
}
async function init(){
  var got=null;
  try{got=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){got=null}
  if(!got){mode='local';CAN=true;lsLoad();ready=true;render();return}
  db=got;mode='cloud';
  try{var u=await window.claude.use('user');CAN=!!(u&&await u.canEdit())}catch(e){CAN=false}
  var timer=setTimeout(function(){if(!ready){ready=true;mode='slow';render()}},10000);
  COLS.forEach(function(c){
    db.collection(c).onSnapshot(function(snap){
      S[c]=snap.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o});
      loaded[c]=1;
      if(!ready&&Object.keys(loaded).length===COLS.length){ready=true;clearTimeout(timer)}
      if(mode==='slow'&&!snap.metadata.fromCache)mode='cloud';
      schedule();
    },function(){toast('Lost connection to the shared data.')});
  });
}

/* ---------- derived numbers ---------- */
function linkTot(b){return sum(b.links||[],function(l){return num(l.qty)*num(l.rate)})}
function billTot(b){return num(b.otc)+num(b.mrc)+linkTot(b)-num(b.discount)}
function billDue(b){return billTot(b)-(D.paid[b.id]||0)}
function purTot(p){return num(p.qty)*num(p.price)}
function purDue(p){return purTot(p)-(D.paidP[p.id]||0)}
function onHand(it){return num(it.open)+(D.sin[it.id]||0)-(D.sout[it.id]||0)}
function derive(){
  D={paid:{},paidP:{},sin:{},sout:{}};
  S.payments.forEach(function(p){var m=p.kind==='collection'?D.paid:D.paidP;m[p.ref]=(m[p.ref]||0)+num(p.amount)});
  S.moves.forEach(function(m){var t=m.type==='in'?D.sin:D.sout;t[m.item]=(t[m.item]||0)+num(m.qty)});
}
function billStatus(b){
  var t=billTot(b),d=billDue(b);
  if(d<=0.005)return ['Paid','good'];
  if(b.due&&b.due<today())return ['Overdue','bad'];
  if(d<t-0.005)return ['Partial','warn'];
  return ['Unpaid','neutral'];
}
function purStatus(p){var d=purDue(p),t=purTot(p);if(d<=0.005)return ['Paid','good'];if(d<t-0.005)return ['Partial','warn'];return ['Unpaid','bad']}
function flows(){
  var f={};CH.forEach(function(c){f[c]={i:0,o:0}});
  function add(ch,k,v){if(f[ch])f[ch][k]+=num(v)}
  S.investors.forEach(function(i){add(i.channel,'i',i.amount)});
  S.payments.forEach(function(p){add(p.channel,p.kind==='collection'?'i':'o',p.amount)});
  S.costs.forEach(function(c){add(c.channel,'o',c.amount)});
  return f;
}
function ledger(){
  var L=[];
  S.investors.forEach(function(i){L.push({date:i.date,type:'Investment',cls:'accent',party:i.name,desc:i.note||'Capital invested',ch:i.channel,i:num(i.amount),o:0})});
  S.payments.forEach(function(p){
    if(p.kind==='collection'){var b=find('bills',p.ref);L.push({date:p.date,type:'Collection',cls:'good',party:b?clientName(b.client):'Unknown client',desc:(b?b.no:'')+(p.txn?' · '+p.txn:''),ch:p.channel,i:num(p.amount),o:0})}
    else{var u=find('purchases',p.ref);L.push({date:p.date,type:'Purchase payment',cls:'warn',party:u?vendorName(u.vendor):'Unknown vendor',desc:(u?u.item:'')+(p.txn?' · '+p.txn:''),ch:p.channel,i:0,o:num(p.amount)})}
  });
  S.costs.forEach(function(c){L.push({date:c.date,type:c.cat||'Cost',cls:'bad',party:c.payee||'',desc:c.txn||c.note||'',ch:c.channel,i:0,o:num(c.amount)})});
  L.sort(function(a,b){return (b.date||'').localeCompare(a.date||'')});
  return L;
}
function monthList(){
  var set={},d=new Date();d.setDate(1);
  for(var k=-14;k<=1;k++){var x=new Date(d.getFullYear(),d.getMonth()+k,1);set[x.getFullYear()+'-'+p2(x.getMonth()+1)]=1}
  S.bills.forEach(function(b){if(b.month)set[b.month]=1});
  return Object.keys(set).sort().reverse();
}
function genNo(month){
  var yy=month.slice(2,4)+month.slice(5,7),n=S.bills.filter(function(b){return b.month===month}).length+1,no;
  do{no='INV-'+yy+'-'+(n<10?'00':n<100?'0':'')+n;n++}while(S.bills.some(function(b){return b.no===no}));
  return no;
}

/* ---------- html builders ---------- */
function hdr(t,s,a){return '<div class="head banner"><div><h1>'+t+'</h1>'+(s?'<p class="sub">'+s+'</p>':'')+'</div><div class="hact">'+(a||'')+'</div></div>'}
function kpi(l,v,s,c){return '<div class="kpi '+(c||'')+'"><div class="kl">'+l+'</div><div class="kv">'+v+'</div>'+(s?'<div class="ks">'+s+'</div>':'')+'</div>'}
function tbl(heads,rows,foot,empty){
  if(!rows.length)return '<div class="empty">'+(empty||'Nothing here yet.')+'</div>';
  return '<div class="tbl"><table><thead><tr>'+heads.map(function(h){return h.charAt(0)==='>'?'<th class="num">'+h.slice(1)+'</th>':'<th>'+h+'</th>'}).join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody>'+(foot?'<tfoot>'+foot+'</tfoot>':'')+'</table></div>';
}
function tn(v,cls){return '<td class="num '+(cls||'')+'">'+fmtN(v)+'</td>'}
function btn(label,act,id,cls){if(!CAN&&!READ[act])return '';return '<button class="btn sm '+(cls||'')+'" data-act="'+act+'"'+(id?' data-id="'+id+'"':'')+'>'+label+'</button>'}
function monthSel(key,val,all){
  var o=monthList();if(val&&o.indexOf(val)<0)o.push(val);
  return '<select id="fl-'+key+'" data-f="'+key+'">'+(all?'<option value="">All months</option>':'')+o.map(function(m){return '<option value="'+m+'"'+(m===val?' selected':'')+'>'+ml(m)+'</option>'}).join('')+'</select>';
}
function fsel(key,label,opts,val){return '<label class="fl">'+label+'<select id="fl-'+key+'" data-f="'+key+'">'+opts.map(function(o){var v=o[0],t=o[1];return '<option value="'+esc(v)+'"'+(v===val?' selected':'')+'>'+esc(t)+'</option>'}).join('')+'</select></label>'}
function chSel(key,val,label){return fsel(key,label||'Channel',[['','All channels']].concat(CH.map(function(c){return [c,c]})),val)}

/* ---------- views ---------- */
function view(){
  if(!ready)return '<div class="empty">Opening your books…</div>';
  return (CAN?'':'<div class="note info"><span><b>View only.</b> You are signed in as a Guest. Only Admin users can add, edit or delete records.</span></div>')+page();
}
function page(){
  switch(UI.page){
    case 'investors':return vInvestors();
    case 'clients':return vClients();
    case 'billing':return vBilling();
    case 'purchases':return vPurchases();
    case 'vendors':return vVendors();
    case 'costs':return vCosts();
    case 'stock':return vStock();
    case 'ledger':return vLedger();
    case 'users':return vUsers();
    case 'reports':return vReports();
    default:return vDash();
  }
}
function footer(){
  var st=mode==='cloud'?'Saved and shared with everyone who opens this page.':mode==='slow'?'Cannot reach the shared store yet. Showing the last saved copy.':'Saved in this browser only. Open the published page while signed in to keep data shared.';
  return '<div class="foot"><span>'+st+'</span><span class="hact"><a class="btn sm" href="#reports">Reports</a>'+btn('Download backup (JSON)','backup')+'</span></div>';
}
function sampleBanner(){
  var any=COLS.some(function(c){return S[c].some(function(x){return x.sample})});
  return any?'<div class="note"><span>Sample data is loaded so you can explore. Remove it before entering real figures.</span>'+btn('Remove sample data','rmSample')+'</div>':'';
}

function vDash(){
  var m=UI.month,inv=sum(S.investors,function(i){return i.amount}),fl=flows();
  var bal=0;CH.forEach(function(c){bal+=fl[c].i-fl[c].o});
  var recv=sum(S.bills,billDue),pay=sum(S.purchases,purDue);
  var mb=S.bills.filter(function(b){return b.month===m});
  var billed=sum(mb,billTot),otc=sum(mb,function(b){return b.otc}),mrc=sum(mb,function(b){return b.mrc}),lk=sum(mb,linkTot);
  var coll=sum(S.payments.filter(function(p){return p.kind==='collection'&&monthOf(p.date)===m}),function(p){return p.amount});
  var purM=sum(S.purchases.filter(function(p){return monthOf(p.date)===m}),purTot);

function chart(m){
  var months=[],y=+m.slice(0,4),mo=+m.slice(5,7);
  for(var k=5;k>=0;k--){var d=new Date(y,mo-1-k,1);months.push(d.getFullYear()+'-'+p2(d.getMonth()+1))}
  var data=months.map(function(x){return [
    sum(S.bills.filter(function(b){return b.month===x}),billTot),
    sum(S.payments.filter(function(p){return p.kind==='collection'&&monthOf(p.date)===x}),function(p){return p.amount}),
    sum(S.costs.filter(function(c){return monthOf(c.date)===x}),function(c){return c.amount})+sum(S.purchases.filter(function(p){return monthOf(p.date)===x}),purTot)]});
  var max=0;data.forEach(function(r){r.forEach(function(v){if(v>max)max=v})});
  if(max<=0)return '<div class="empty">Bills, collections and expenses will appear here.</div>';
  var step=Math.pow(10,Math.floor(Math.log(max)/Math.LN10)),nice=Math.ceil(max/step)*step;
  if(nice/step>6){nice=Math.ceil(max/(step*2))*step*2}
  var cols=['var(--c1)','var(--c5)','var(--c3)'],names=['Billed','Collected','Expenses (costs + purchases)'];
  var grid='';for(var g=0;g<=4;g++){grid+='<div class="gl" style="top:'+(100-g*25)+'%"><span>'+short(nice*g/4)+'</span></div>'}
  var bars=data.map(function(r,i){return '<div class="pair" title="'+ml(months[i])+'">'+r.map(function(v,j){return '<div class="bar" title="'+names[j]+': '+fmt(v)+'" style="height:'+(v/nice*100)+'%;background:'+cols[j]+'"></div>'}).join('')+'</div>'}).join('');
  return '<div class="legend">'+names.map(function(n,i){return '<span><i style="background:'+cols[i]+'"></i>'+n+'</span>'}).join('')+'</div><div class="chart"><div class="plot">'+grid+'<div class="bars">'+bars+'</div></div><div class="xl">'+months.map(function(x){return '<span>'+MON[+x.slice(5,7)-1]+'</span>'}).join('')+'</div></div>';
}

  modal(r.id?'Edit stock item':'Add stock item',fld('name','Item name',r.name,{attr:'required'})+'<div class="grid2">'+fld('unit','Unit (pcs, m, box)',r.unit)+fld('open','Opening quantity',r.open==null?0:r.open,{type:'number'})+'</div>'+fld('min','Reorder level (alert at or below)',r.min==null?0:r.min,{type:'number'}),
    {onSubmit:function(fd){var v=obj(fd);put('stock',keep(r,Object.assign({},r,{name:v.name.trim(),unit:v.unit,open:num(v.open),min:num(v.min)})))}});
}
function formMove(type,itemId){
  if(!S.stock.length){toast('Add a stock item first.');formItem();return}
  var out=type==='out',list=S.stock.slice().sort(function(a,b){return a.name.localeCompare(b.name)});
  var cl='<datalist id="clientnames">'+S.clients.map(function(c){return '<option value="'+esc(c.name)+'">'}).join('')+'</datalist>';
  modal(out?'Stock out':'Stock in',
    sel('item','Item',list.map(function(i){return [i.id,i.name+' · on hand '+fmtN(onHand(i))+' '+(i.unit||'')]}),itemId||list[0].id)+
    '<div class="grid2">'+fld('date','Date',today(),{type:'date',attr:'required'})+fld('qty','Quantity',1,{type:'number',attr:'required'})+'</div>'+
    fld('party',out?'Issued to (client or job)':'Received from','',{attr:out?'list="clientnames"':''})+fld('note','Note','')+cl,
    {ok:out?'Record stock out':'Record stock in',onSubmit:function(fd){
      var v=obj(fd),qty=num(v.qty),it=find('stock',v.item);
      if(qty<=0){toast('Quantity must be above zero.');return false}
      if(out&&it&&qty>onHand(it)+1e-9){toast('Only '+fmtN(onHand(it))+' '+(it.unit||'')+' on hand.');return false}
      put('moves',{item:v.item,type:type,qty:qty,date:v.date,party:v.party,note:v.note});
    }});
}

/* ---------- delete with cascades ---------- */
function delCascade(col,id){
  if(col==='bills')S.payments.filter(function(p){return p.kind==='collection'&&p.ref===id}).forEach(function(p){del('payments',p.id)});
  if(col==='purchases'){S.payments.filter(function(p){return p.kind==='purchase'&&p.ref===id}).forEach(function(p){del('payments',p.id)});S.moves.filter(function(m){return m.ref===id}).forEach(function(m){del('moves',m.id)})}
  if(col==='stock')S.moves.filter(function(m){return m.item===id}).forEach(function(m){del('moves',m.id)});
  del(col,id);
}
function askDel(col,id,what,extra){ask('Delete '+what+'?'+(extra?' '+extra:'')+' This cannot be undone.',function(){delCascade(col,id)})}

/* ---------- reports, workbook, backup and restore ---------- */
function rpData(key,m){
  var inM=function(d){return !m||monthOf(d)===m};
  var A=function(n){return Math.round(n*100)/100};
  switch(key){
    case 'summary':
      var mb=S.bills.filter(function(b){return !m||b.month===m});
      var coll=sum(S.payments.filter(function(p){return p.kind==='collection'&&inM(p.date)}),function(p){return p.amount});
      var pur=sum(S.purchases.filter(function(p){return inM(p.date)}),purTot);
      var pout=sum(S.payments.filter(function(p){return p.kind==='purchase'&&inM(p.date)}),function(p){return p.amount});
      var cost=sum(S.costs.filter(function(c){return inM(c.date)}),function(c){return c.amount});
      var inv=sum(S.investors,function(i){return i.amount});
      return {name:'Summary',head:['Item','Amount (BDT)'],rows:[['Period',m?ml(m):'All months'],['Opening balance (total investment)',A(inv)],['Billed: OTC',A(sum(mb,function(b){return b.otc}))],['Billed: MRC',A(sum(mb,function(b){return b.mrc}))],['Billed: link charges',A(sum(mb,linkTot))],['Billed: total',A(sum(mb,billTot))],['Collected',A(coll)],['Purchases',A(pur)],['Purchase payments',A(pout)],['Costs',A(cost)],['Net cash flow',A(coll-pout-cost)],['Client dues (all time)',A(sum(S.bills,billDue))],['Vendor payables (all time)',A(sum(S.purchases,purDue))]]};
    case 'bills':
      return {name:'Monthly bills',head:['Bill no','Client','Month','Bill date','Due date','OTC','MRC','Link charges','Discount','Total','Paid','Due','Status'],rows:S.bills.filter(function(b){return !m||b.month===m}).sort(function(a,b){return (a.no||'').localeCompare(b.no||'')}).map(function(b){return [b.no,clientName(b.client),b.month,b.date,b.due,A(num(b.otc)),A(num(b.mrc)),A(linkTot(b)),A(num(b.discount)),A(billTot(b)),A(D.paid[b.id]||0),A(billDue(b)),billStatus(b)[0]]})};
    case 'links':
      var r=[];S.bills.filter(function(b){return !m||b.month===m}).forEach(function(b){(b.links||[]).forEach(function(l){r.push([b.month,clientName(b.client),b.no,l.type,num(l.qty),num(l.rate),A(num(l.qty)*num(l.rate))])})});
      return {name:'Link-wise billing',head:['Month','Client','Bill no','Link type','Quantity','Rate','Amount'],rows:r};
    case 'collections':
      return {name:'Collections',head:['Date','Client','Bill no','Channel','Reference','Amount'],rows:S.payments.filter(function(p){return p.kind==='collection'&&inM(p.date)}).sort(function(a,b){return (a.date||'').localeCompare(b.date||'')}).map(function(p){var b=find('bills',p.ref);return [p.date,b?clientName(b.client):'',b?b.no:'',p.channel,p.txn||'',A(num(p.amount))]})};
    case 'clientdues':
      return {name:'Client dues',head:['Client','Phone','Billed','Paid','Due'],rows:S.clients.map(function(c){var bs=S.bills.filter(function(b){return b.client===c.id});var t=sum(bs,billTot),d=sum(bs,billDue);return [c.name,c.phone||'',A(t),A(t-d),A(d)]}).filter(function(r){return r[2]>0})};
    case 'purchases':
      return {name:'Purchases',head:['Date','Vendor','Invoice','Item','Qty','Unit','Unit price','Total','Paid','Due','Status'],rows:S.purchases.filter(function(p){return inM(p.date)}).sort(function(a,b){return (a.date||'').localeCompare(b.date||'')}).map(function(p){return [p.date,vendorName(p.vendor),p.inv||'',p.item,num(p.qty),p.unit||'',num(p.price),A(purTot(p)),A(D.paidP[p.id]||0),A(purDue(p)),purStatus(p)[0]]})};
    case 'vendordues':
      return {name:'Vendor dues',head:['Vendor','Phone','Purchased','Paid','Due'],rows:S.vendors.map(function(v){var ps=S.purchases.filter(function(p){return p.vendor===v.id});var t=sum(ps,purTot),d=sum(ps,purDue);return [v.name,v.phone||'',A(t),A(t-d),A(d)]}).filter(function(r){return r[2]>0})};
    case 'costs':
      return {name:'Costs',head:['Date','Category','Paid to','Channel','Reference','Amount'],rows:S.costs.filter(function(c){return inM(c.date)}).sort(function(a,b){return (a.date||'').localeCompare(b.date||'')}).map(function(c){return [c.date,c.cat,c.payee||'',c.channel,c.txn||'',A(num(c.amount))]})};
    case 'stock':
      return {name:'Stock',head:['Item','Unit','Opening','In','Out','On hand','Reorder level'],rows:S.stock.map(function(i){return [i.name,i.unit||'',num(i.open),D.sin[i.id]||0,D.sout[i.id]||0,onHand(i),num(i.min)]})};
    case 'investors':
      var tot=sum(S.investors,function(i){return i.amount});
      return {name:'Investors',head:['Date','Investor','Channel','Amount','Share %'],rows:S.investors.slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'')}).map(function(i){return [i.date,i.name,i.channel,A(num(i.amount)),tot?A(num(i.amount)/tot*100):0]})};
    case 'channels':
      var f=flows();return {name:'Channel balances',head:['Channel','In','Out','Balance'],rows:CH.map(function(c){return [c,A(f[c].i),A(f[c].o),A(f[c].i-f[c].o)]})};
    default:
      return {name:'Ledger',head:['Date','Type','Party','Details','Channel','In','Out'],rows:ledger().filter(function(x){return inM(x.date)}).reverse().map(function(x){return [x.date,x.type,x.party,x.desc,x.ch,x.i||'',x.o||'']})};
  }
}

function csvOf(d){return '﻿'+[d.head].concat(d.rows).map(function(r){return r.map(csvCell).join(',')}).join('\n')}
function rpCsv(key){var d=rpData(key,UI.rp);save('taranga-'+key+'-'+(UI.rp||'all')+'.csv',csvOf(d))}
function loadXlsx(){
  return new Promise(function(res,rej){
    if(window.XLSX)return res(window.XLSX);
    var sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload=function(){window.XLSX?res(window.XLSX):rej()};sc.onerror=function(){rej()};document.head.appendChild(sc);
  });
}
async function rpXlsx(){
  var X;try{X=await loadXlsx()}catch(e){toast('Could not load the Excel writer. Use the CSV downloads instead.');return}
  var wb=X.utils.book_new();
  REPORTS.forEach(function(r){var d=rpData(r[0],UI.rp);var ws=X.utils.aoa_to_sheet([d.head].concat(d.rows));ws['!cols']=d.head.map(function(h,i){return {wch:Math.max(String(h).length+2,14)}});X.utils.book_append_sheet(wb,ws,d.name.slice(0,31))});
  var buf=X.write(wb,{bookType:'xlsx',type:'array'});
  save('taranga-reports-'+(UI.rp||'all')+'.xlsx',buf);
}
function onRestoreFile(file){
  var fr=new FileReader();
  fr.onload=function(){
    var o;try{o=JSON.parse(fr.result)}catch(e){toast('That file is not a valid backup.');return}
    if(!o||o.app!=='Taranga ERP'){toast('That file is not a Taranga ERP backup.');return}
    var n=0;COLS.forEach(function(c){if(Array.isArray(o[c]))n+=o[c].length});
    if(!n){toast('The backup file has no records.');return}
    var cnt=COLS.filter(function(c){return Array.isArray(o[c])&&o[c].length}).map(function(c){return c+' '+o[c].length}).join(', ');
    modal('Restore backup','<p>Found <b>'+n+'</b> records'+(o.exported?' from '+esc(o.exported):'')+'.</p><p class="sub">'+esc(cnt)+'</p>'+sel('mode','How to restore',[['merge','Merge: add records and overwrite matching ones'],['replace','Replace everything: delete current data that is not in the backup']],'merge'),{ok:'Restore',onSubmit:function(fd){
      var replace=fd.get('mode')==='replace';
      COLS.forEach(function(c){
        var list=Array.isArray(o[c])?o[c]:[],keep={};
        list.forEach(function(r){if(r&&r.id)keep[r.id]=1});
        if(replace)S[c].slice().forEach(function(r){if(!keep[r.id])del(c,r.id)});
        list.forEach(function(r){if(r&&r.id)put(c,r)});
      });
      toast('Restored '+n+' records.');
    }});
  };
  fr.readAsText(file);
}

/* ---------- downloads ---------- */
async function save(filename,data){
  var dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(!dl){toast('Downloads are not available in this view.');return}
  try{await dl.save({filename:filename,data:data})}catch(e){if(e&&e.code!=='declined')toast('Could not save the file.')}
}
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCsv(){

function backup(){
  var o={app:'Taranga ERP',version:2,exported:today(),counts:{}};COLS.forEach(function(c){o[c]=S[c];o.counts[c]=S[c].length});
  save('taranga-erp-backup-'+today()+'.json',JSON.stringify(o,null,1));
}

  pay:function(id){formPay(id)},
  'add-vendor':function(){formVendor()},'edit-vendor':function(id){formVendor(find('vendors',id))},
  'del-vendor':function(id){var n=S.purchases.filter(function(p){return p.vendor===id}).length;askDel('vendors',id,'this vendor',n?'Their '+n+' purchases stay in your records.':'')},
  'add-cost':function(){formCost()},'edit-cost':function(id){formCost(find('costs',id))},'del-cost':function(id){askDel('costs',id,'this cost')},
  'add-item':function(){formItem()},'edit-item':function(id){formItem(find('stock',id))},'del-item':function(id){askDel('stock',id,'this item','Its stock movements are deleted too.')},
  'move-in':function(id){formMove('in',id)},'move-out':function(id){formMove('out',id)},'del-move':function(id){askDel('moves',id,'this stock movement')},
  'add-team':function(){formTeam()},'edit-team':function(id){formTeam(find('team',id))},'del-team':function(id){askDel('team',id,'this team member')},
  'rp-csv':function(id){rpCsv(id)},'rp-xlsx':rpXlsx,
  loadSample:loadSample,rmSample:rmSample,csv:exportCsv,backup:backup
};
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var fn=ACT[t.dataset.act];if(fn&&!CAN&&!READ[t.dataset.act]){toast('View only: Guest users cannot change data.');return}
  if(fn){e.preventDefault();fn(t.dataset.id||'',t,e)}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.f){UI[t.dataset.f]=t.value;render();return}
  if(t.closest&&t.closest('#mform'))recalc();
});
document.addEventListener('change',function(e){
  var t=e.target,f=$('#mform');
  if(t.id==='restoreFile'){if(t.files&&t.files[0])onRestoreFile(t.files[0]);t.value='';return}if(!f||!f.contains(t))return;
  if(M.kind==='bill'&&t.id==='f-client'&&!M.editing){
    var c=find('clients',t.value);if(c){f.elements.mrc.value=c.mrc||'';$('#lrows').innerHTML=linkRows(c.links);recalc()}
  }
  if(M.kind==='bill'&&t.id==='f-month'){f.elements.date.value=t.value+'-01';f.elements.due.value=t.value+'-10'}
  if(M.kind==='collect'&&t.id==='f-bill'){var b=find('bills',t.value);if(b)f.elements.amount.value=Math.max(0,billDue(b))}
});
$('#mform').addEventListener('submit',function(e){
  e.preventDefault();
  var r=M.submit?M.submit(new FormData(e.target)):undefined;
  if(r!==false)closeModal();
});
window.addEventListener('hashchange',route);
function route(){
  var h=(location.hash||'').replace('#','');
  UI.page=PAGES.some(function(p){return p[0]===h})?h:'dashboard';
  render();window.scrollTo(0,0);
}

/* ---------- render ---------- */
function schedule(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;render()})}
function render(){
  var v=$('#view'),a=document.activeElement,keepId=a&&a.id&&v.contains(a)?a.id:null,ss=null,se=null;
  if(keepId){try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}}
  derive();setLists();
  $('#who').innerHTML=ready?(CAN?pill(mode==='local'?'Admin · this browser':'Admin','accent')+' <small style="color:var(--muted)">Can edit</small>':pill('Guest','neutral')+' <small style="color:var(--muted)">View only</small>'):'';
  $('#nav').innerHTML=PAGES.map(function(p){return '<a href="#'+p[0]+'" class="'+(UI.page===p[0]?'on':'')+'"'+(UI.page===p[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+ICON[p[0]]+'"/></svg>'+p[1]+'</a>'}).join('');
  v.innerHTML=view();
  if(keepId){var el=document.getElementById(keepId);if(el&&v.contains(el)){el.focus();if(ss!=null){try{el.setSelectionRange(ss,se)}catch(e){}}}}
}
route();
init();
})();
</script>
